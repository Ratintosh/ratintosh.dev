<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wortschatzkasten — Karteikarten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500;600;700&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cork:#3E2C1E;
    --cork-dark:#2B1D13;
    --cork-hi:#4A3524;
    --card:#FBF7ED;
    --card-edge:#E7DFC9;
    --card-line:#DCD3B8;
    --ink:#241F1C;
    --ink-soft:#6B6153;
    --paper-shadow: rgba(0,0,0,.45);
    --crimson:#C81F4E;
    --crimson-dark:#9C1740;
    --amber:#E0812E;
    --amber-dark:#B4611B;
    --sage:#5C8A5C;
    --sage-dark:#3F6B40;
    --rust:#9C4A34;
    --rust-dark:#7A3626;
    --accent: var(--crimson);
    --accent-dark: var(--crimson-dark);
    --focus: #F2C744;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Karla', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,.12) 0, transparent 3%),
      radial-gradient(circle at 82% 12%, rgba(0,0,0,.10) 0, transparent 2.6%),
      radial-gradient(circle at 40% 78%, rgba(0,0,0,.10) 0, transparent 2.4%),
      radial-gradient(circle at 68% 55%, rgba(0,0,0,.08) 0, transparent 2%),
      radial-gradient(circle at 25% 60%, rgba(0,0,0,.09) 0, transparent 2.2%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,.10) 0, transparent 2.4%),
      radial-gradient(circle at 55% 30%, rgba(0,0,0,.08) 0, transparent 2%),
      linear-gradient(155deg, var(--cork-hi), var(--cork) 45%, var(--cork-dark) 100%);
    background-size: 3px 3px, 4px 4px, 3px 3px, 4px 4px, 3px 3px, 4px 4px, 3px 3px, cover;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 60px;
    transition: background .5s ease;
  }

  /* ---------- header ---------- */
  .masthead{
    width:100%;
    max-width:760px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    color:#F3EAD8;
    font-size:clamp(28px, 5vw, 40px);
    margin:0;
    letter-spacing:.2px;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .masthead .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:#C9B9A0;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-top:4px;
  }

  .chapter-tabs{
    display:flex;
    gap:8px;
  }
  .chapter-tab{
    position:relative;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:#fff;
    width:38px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
    clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
    opacity:.55;
    transform: translateY(2px);
    transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .chapter-tab[data-ch="all"]{ background: linear-gradient(160deg, #7d8f7a, #52604f); font-size:10px; letter-spacing:.03em;}
  .chapter-tab.active{ opacity:1; transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,.45); }
  .chapter-tab:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  /* ---------- mode tabs ---------- */
  .mode-tabs{
    width:100%;
    max-width:760px;
    display:flex;
    gap:2px;
    margin-bottom:14px;
    background: rgba(0,0,0,.22);
    border-radius:22px;
    padding:3px;
    border:1px solid #4a3826;
  }
  .mode-tab{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    color:#C9B9A0;
    background:transparent;
    border:none;
    border-radius:18px;
    padding:10px 14px;
    cursor:pointer;
    transition: background .18s ease, color .18s ease;
  }
  .mode-tab.active{
    background: var(--accent);
    color:#fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  .mode-tab:hover:not(.active){ color:#EFE6D3; }
  .mode-tab:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  /* ---------- controls strip ---------- */
  .controls{
    width:100%;
    max-width:760px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:26px;
    font-family:'JetBrains Mono', monospace;
  }
  .controls select{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background: #2B1D13;
    color:#EFE6D3;
    border:1px solid #5A4530;
    border-radius:5px;
    padding:8px 10px;
    cursor:pointer;
  }
  .controls select:focus-visible{ outline:3px solid var(--focus); outline-offset:1px; }
  .icon-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background: transparent;
    color:#EFE6D3;
    border:1px solid #5A4530;
    border-radius:5px;
    padding:8px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition: background .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,.06); border-color:#8a6f4d; }
  .icon-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:1px; }
  .spacer{ flex:1; }

  .tally{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:#EFE6D3;
    display:flex;
    gap:14px;
    align-items:center;
  }
  .tally span.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }

  /* ---------- stage ---------- */
  .stage{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card-frame{
    perspective:1400px;
    width:100%;
    max-width:360px;
    height:460px;
    position:relative;
    margin-bottom:8px;
  }
  .pin{
    position:absolute;
    top:-13px;
    left:50%;
    transform:translateX(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a8a, var(--accent) 60%, var(--accent-dark) 100%);
    box-shadow: 0 3px 4px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.5);
    z-index:5;
    transition: background .3s ease;
  }
  .pin::after{
    content:"";
    position:absolute;
    top:16px; left:50%;
    transform:translateX(-50%);
    width:2px; height:10px;
    background: rgba(0,0,0,.35);
    filter: blur(.5px);
  }

  .card{
    width:100%;
    height:100%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2,.9,.25,1);
    cursor:pointer;
    transform: rotate(var(--tilt, -1.2deg));
  }
  .card.flipped{ transform: rotate(var(--tilt, -1.2deg)) rotateY(180deg); }
  .card:focus-visible{ outline:3px solid var(--focus); outline-offset:6px; }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    background: var(--card);
    border-radius: 3px 10px 10px 3px;
    box-shadow:
      0 18px 30px var(--paper-shadow),
      0 2px 0 rgba(0,0,0,.15) inset;
    background-image: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 39px,
        var(--card-line) 40px
      );
    padding: 34px 26px 24px;
    display:flex;
    flex-direction:column;
  }
  .face.back{ transform: rotateY(180deg); }

  .face::before{ /* left punch margin line, like ruled paper */
    content:"";
    position:absolute;
    left:20px; top:0; bottom:0;
    width:1px;
    background: rgba(200,31,78,.25);
  }

  .tab-flap{
    position:absolute;
    top:0;
    right:14px;
    width:34px;
    height:30px;
    background: linear-gradient(160deg, var(--accent), var(--accent-dark));
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:5px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    color:#fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
  }

  .cat-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color: var(--accent-dark);
    margin-bottom:6px;
    padding-right:40px;
  }
  .pos-label{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--ink-soft);
    margin-bottom:auto;
  }

  .word-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:10px;
  }
  .article-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .article{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:15px;
    padding:2px 8px;
    border-radius:4px;
    color:#fff;
  }
  .article.der{ background:#3D5A80; }
  .article.die{ background:#B5405A; }
  .article.das{ background:#4C7C4A; }
  .article.dd{ background:#8a6f4d; font-size:11px; }
  .article.big{
    font-size:22px;
    padding:6px 16px;
    border-radius:8px;
    box-shadow: 0 3px 8px rgba(0,0,0,.2);
  }
  .article-reveal-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .noun-gloss{
    font-family:'Karla', sans-serif;
    font-style:italic;
    font-size:14px;
    color: var(--ink-soft);
    margin-top:auto;
    padding-top:10px;
    border-top:1px solid var(--card-edge);
  }

  .german-word{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(26px, 7vw, 34px);
    line-height:1.12;
    color:var(--ink);
  }
  .plural-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color: var(--ink-soft);
  }
  .example-front{
    font-family:'Karla', sans-serif;
    font-style:italic;
    font-size:13px;
    color: var(--ink-soft);
    margin-top:2px;
  }
  .flip-hint{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--ink-soft);
    opacity:.65;
    align-self:flex-end;
  }

  .english-word{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(22px, 6vw, 28px);
    color:var(--ink);
    margin-bottom:14px;
  }
  .back .cat-label{ padding-right:40px; }
  .example-back{
    font-family:'Karla', sans-serif;
    font-size:14px;
    color: var(--ink-soft);
    border-left:2px solid var(--card-edge);
    padding-left:10px;
    margin-top:auto;
    line-height:1.5;
  }
  .example-back .lbl{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--accent-dark);
    margin-bottom:4px;
  }

  /* ---------- rating buttons ---------- */
  .rate-row{
    display:flex;
    gap:14px;
    margin-top:14px;
    width:100%;
    max-width:360px;
  }
  .rate-btn{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.02em;
    padding:13px 8px;
    border-radius:24px;
    border:none;
    cursor:pointer;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .rate-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .rate-btn:not(:disabled):hover{ transform: translateY(-2px); box-shadow: 0 7px 14px rgba(0,0,0,.4); }
  .rate-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .rate-btn.again{ background: linear-gradient(160deg, var(--rust), var(--rust-dark)); }
  .rate-btn.know{ background: linear-gradient(160deg, var(--sage), var(--sage-dark)); }
  .rate-btn .pindot{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.85); }

  .progress-row{
    width:100%;
    max-width:360px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:#C9B9A0;
  }
  .progress-track{
    flex:1;
    height:4px;
    background: rgba(255,255,255,.12);
    border-radius:2px;
    margin:0 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width .3s ease, background .3s ease;
  }

  .empty-state{
    text-align:center;
    color:#EFE6D3;
    font-family:'Karla', sans-serif;
    padding:60px 20px;
    max-width:360px;
  }
  .empty-state h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    margin-bottom:8px;
  }
  .empty-state button{
    margin-top:18px;
    font-family:'JetBrains Mono', monospace;
    background: var(--accent);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    font-size:12.5px;
  }

  footer{
    margin-top:34px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:#9C8A70;
    text-align:center;
    max-width:400px;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .rate-btn, .chapter-tab, .progress-fill{ transition:none !important; }
  }

  @media (max-width:420px){
    .card-frame{ height:420px; }
    .controls{ justify-content:flex-start; }
  }
</style>
</head>
<body>

  <div class="masthead">
    <div>
      <h1>Wortschatzkasten</h1>
      <div class="sub" id="subtitle">Kapitel 8, 9, 11 &amp; 12 · Karteikarten</div>
    </div>
    <div class="chapter-tabs" role="group" aria-label="Kapitel wählen" id="chapterTabs">
      <!-- populated dynamically from VOCAB_DATA -->
    </div>
  </div>

  <div class="mode-tabs" role="group" aria-label="Übungsmodus wählen">
    <button class="mode-tab active" id="mode-translate" data-mode="translate">Vokabeln</button>
    <button class="mode-tab" id="mode-article" data-mode="article">Artikel-Training</button>
  </div>

  <div class="controls">
    <select id="categorySelect" aria-label="Kategorie filtern">
      <option value="all">Alle Kategorien</option>
    </select>
    <button class="icon-btn" id="shuffleBtn" title="Mischen">⤨ Mischen</button>
    <button class="icon-btn" id="dirBtn" title="Richtung umkehren">DE → EN</button>
    <div class="spacer"></div>
    <button class="icon-btn" id="resetBtn" title="Fortschritt zurücksetzen">↺ Zurücksetzen</button>
  </div>

  <div class="controls" style="margin-top:-14px;">
    <div class="tally" id="tally">
      <span><span class="dot" style="background:var(--sage)"></span><span id="knowCount">0</span> gewusst</span>
      <span><span class="dot" style="background:var(--rust)"></span><span id="learnCount">0</span> nochmal</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="card-frame" id="cardFrame">
      <div class="pin" id="pin"></div>
      <div class="card" id="card" tabindex="0" role="button" aria-label="Karteikarte umdrehen">
        <div class="face front">
          <div class="tab-flap" id="tabFlapFront">8</div>
          <div class="cat-label" id="catLabelFront">—</div>
          <div class="word-wrap" id="frontWrap"></div>
          <div class="flip-hint">antippen zum umdrehen</div>
        </div>
        <div class="face back">
          <div class="tab-flap" id="tabFlapBack">8</div>
          <div class="cat-label" id="catLabelBack">—</div>
          <div class="word-wrap" id="backWrap"></div>
        </div>
      </div>
    </div>

    <div class="rate-row">
      <button class="rate-btn again" id="againBtn"><span class="pindot"></span>Nochmal üben</button>
      <button class="rate-btn know" id="knowBtn"><span class="pindot"></span>Kann ich!</button>
    </div>

    <div class="progress-row">
      <span id="progressLabel">1 / 1</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <footer>
    Tippe die Karte an, um die Übersetzung zu sehen. Wähle „Kann ich!“ oder „Nochmal üben“, um zur nächsten Karte zu gehen — dein Fortschritt wird lokal in diesem Browser gespeichert.
  </footer>

<script>
(function(){
  "use strict";

  // ---------- flatten data ----------
  const allCards = [];
  VOCAB_DATA.chapters.forEach(ch => {
    ch.categories.forEach(cat => {
      cat.words.forEach(word => {
        allCards.push({
          id: `${ch.number}-${cat.name}-${word.de}`,
          chapter: ch.number,
          chapterTitle: ch.title,
          accent: ch.accent,
          category: cat.name,
          ...word
        });
      });
    });
  });

  // ---------- state ----------
  const STORAGE_KEY = "wortschatzkasten_progress_v1";
  let progress = {}; // id -> 'know' | 'again'
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) progress = JSON.parse(saved);
  }catch(e){ progress = {}; }

  function saveProgress(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
  }

  let state = {
    chapterFilter: "all",
    categoryFilter: "all",
    direction: "de-en", // or 'en-de'
    mode: "translate", // 'translate' or 'article'
    deck: [],
    index: 0,
    flipped: false,
  };

  function isPureNoun(c){
    return c.article === "der" || c.article === "die" || c.article === "das";
  }

  // ---------- DOM ----------
  const els = {
    tabsContainer: document.getElementById("chapterTabs"),
    modeTranslate: document.getElementById("mode-translate"),
    modeArticle: document.getElementById("mode-article"),
    categorySelect: document.getElementById("categorySelect"),
    shuffleBtn: document.getElementById("shuffleBtn"),
    dirBtn: document.getElementById("dirBtn"),
    resetBtn: document.getElementById("resetBtn"),
    subtitle: document.getElementById("subtitle"),
    stage: document.getElementById("stage"),
    cardFrame: document.getElementById("cardFrame"),
    card: document.getElementById("card"),
    pin: document.getElementById("pin"),
    tabFlapFront: document.getElementById("tabFlapFront"),
    tabFlapBack: document.getElementById("tabFlapBack"),
    catLabelFront: document.getElementById("catLabelFront"),
    catLabelBack: document.getElementById("catLabelBack"),
    frontWrap: document.getElementById("frontWrap"),
    backWrap: document.getElementById("backWrap"),
    againBtn: document.getElementById("againBtn"),
    knowBtn: document.getElementById("knowBtn"),
    progressLabel: document.getElementById("progressLabel"),
    progressFill: document.getElementById("progressFill"),
    progressPct: document.getElementById("progressPct"),
    knowCount: document.getElementById("knowCount"),
    learnCount: document.getElementById("learnCount"),
  };

  function articleClass(article){
    if(!article) return "dd";
    if(article.startsWith("der")) return "der";
    if(article.startsWith("die")) return "die";
    if(article.startsWith("das")) return "das";
    return "dd";
  }

  function buildCategoryOptions(){
    const chNum = state.chapterFilter;
    const cats = new Set();
    VOCAB_DATA.chapters.forEach(ch => {
      if(chNum !== "all" && String(ch.number) !== String(chNum)) return;
      ch.categories.forEach(cat => {
        const words = state.mode === "article" ? cat.words.filter(isPureNoun) : cat.words;
        if(words.length > 0) cats.add(cat.name);
      });
    });
    els.categorySelect.innerHTML = '<option value="all">Alle Kategorien</option>' +
      Array.from(cats).map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join("");
    if(Array.from(cats).includes(state.categoryFilter)){
      els.categorySelect.value = state.categoryFilter;
    } else {
      state.categoryFilter = "all";
      els.categorySelect.value = "all";
    }
  }

  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  function buildDeck(){
    let filtered = allCards.filter(c => {
      if(state.chapterFilter !== "all" && String(c.chapter) !== String(state.chapterFilter)) return false;
      if(state.categoryFilter !== "all" && c.category !== state.categoryFilter) return false;
      if(state.mode === "article" && !isPureNoun(c)) return false;
      return true;
    });
    state.deck = filtered;
    state.index = 0;
    state.flipped = false;
  }

  function shuffleDeck(){
    for(let i = state.deck.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
    }
    state.index = 0;
    state.flipped = false;
    render();
  }

  function setAccent(hex){
    document.documentElement.style.setProperty("--accent", hex);
    // derive a darker shade roughly
    document.documentElement.style.setProperty("--accent-dark", shade(hex, -0.28));
  }

  function shade(hex, amt){
    const num = parseInt(hex.slice(1), 16);
    let r = (num >> 16) + Math.round(255*amt);
    let g = ((num >> 8) & 0x00FF) + Math.round(255*amt);
    let b = (num & 0x0000FF) + Math.round(255*amt);
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return "#" + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  function currentCard(){
    return state.deck[state.index];
  }

  function render(){
    updateTally();
    if(state.deck.length === 0){
      renderEmpty();
      return;
    }
    els.stage.querySelectorAll(".empty-state").forEach(n => n.remove());
    els.cardFrame.style.display = "";
    document.querySelector(".rate-row").style.display = "";
    document.querySelector(".progress-row").style.display = "";

    const c = currentCard();
    setAccent(c.accent);
    els.card.classList.remove("flipped");
    state.flipped = false;
    // slight deterministic tilt per card for physical feel
    const tilt = ((c.id.length * 37) % 5) - 2.2;
    els.card.style.setProperty("--tilt", tilt.toFixed(2) + "deg");

    els.tabFlapFront.textContent = c.chapter;
    els.tabFlapBack.textContent = c.chapter;
    els.catLabelFront.textContent = c.category;

      frontHtml += `<div class="pos-label">Welcher Artikel?</div>`;
      frontHtml += `<div class="german-word">${escapeHtml(c.de)}</div>`;
      els.frontWrap.innerHTML = frontHtml;

      backHtml += `<div class="article-reveal-row">`;
      backHtml += `<span class="article big ${articleClass(c.article)}">${escapeHtml(c.article)}</span>`;
      backHtml += `<span class="german-word" style="font-size:24px;">${escapeHtml(c.de)}</span>`;
      backHtml += `</div>`;
      if(c.plural){
        backHtml += `<div class="plural-tag">Plural: die ${escapeHtml(pluralDisplay(c))}</div>`;
      }
      backHtml += `<div class="noun-gloss">${escapeHtml(c.en)}</div>`;
      els.backWrap.innerHTML = backHtml;
    } else if(isDeEn){
      frontHtml += `<div class="article-row">`;
      if(c.article){
        frontHtml += `<span class="article ${articleClass(c.article)}">${escapeHtml(c.article)}</span>`;
      } else if(c.pos){
        frontHtml += `<span class="pos-label">${escapeHtml(c.pos)}</span>`;
      }
      frontHtml += `</div>`;
      frontHtml += `<div class="german-word">${escapeHtml(c.de)}</div>`;
      if(c.plural){
        frontHtml += `<div class="plural-tag">Plural: ${escapeHtml(pluralDisplay(c))}</div>`;
      }
      els.frontWrap.innerHTML = frontHtml;

      backHtml += `<div class="english-word">${escapeHtml(c.en)}</div>`;
      if(c.example){
        backHtml += `<div class="example-back"><span class="lbl">Beispiel</span>${escapeHtml(c.example)}</div>`;
      }
      els.backWrap.innerHTML = backHtml;
    } else {
      frontHtml += `<div class="english-word">${escapeHtml(c.en)}</div>`;
      els.frontWrap.innerHTML = frontHtml;

      backHtml += `<div class="article-row">`;
      if(c.article){
        backHtml += `<span class="article ${articleClass(c.article)}">${escapeHtml(c.article)}</span>`;
      } else if(c.pos){
        backHtml += `<span class="pos-label">${escapeHtml(c.pos)}</span>`;
      }
      backHtml += `</div>`;
      backHtml += `<div class="german-word">${escapeHtml(c.de)}</div>`;
      if(c.plural){
        backHtml += `<div class="plural-tag">Plural: ${escapeHtml(pluralDisplay(c))}</div>`;
      }
      if(c.example){
        backHtml += `<div class="example-back"><span class="lbl">Beispiel</span>${escapeHtml(c.example)}</div>`;
      }
      els.backWrap.innerHTML = backHtml;
    }

    els.progressLabel.textContent = `${state.index + 1} / ${state.deck.length}`;
    const doneCount = state.deck.filter(cc => progress[cc.id]).length;
    const pct = Math.round((doneCount / state.deck.length) * 100);
    els.progressFill.style.width = pct + "%";
    els.progressPct.textContent = pct + "%";

    const modeLabel = state.mode === "article" ? "Artikel-Training" : "Karteikarten";
    const allChapterNums = VOCAB_DATA.chapters.map(ch => ch.number).join(" & ");
    els.subtitle.textContent = `${state.deck.length} Karten · ${state.chapterFilter === "all" ? "Kapitel " + allChapterNums : "Kapitel " + state.chapterFilter} · ${modeLabel}`;
  }

  function pluralDisplay(c){
    if(!c.plural) return "";
    if(c.plural.startsWith("(")) return c.plural;
    if(c.plural.startsWith("¨")) return "⁠" + c.plural; // umlaut plural marker kept as-is
    return c.plural;
  }

  function renderEmpty(){
    els.cardFrame.style.display = "none";
    document.querySelector(".rate-row").style.display = "none";
    document.querySelector(".progress-row").style.display = "none";
    if(!els.stage.querySelector(".empty-state")){
      const div = document.createElement("div");
      div.className = "empty-state";
      div.innerHTML = `<h2>Keine Karten gefunden</h2><p>Für diese Auswahl gibt es keine Wörter. Wähle eine andere Kategorie.</p>`;
      els.stage.insertBefore(div, els.stage.firstChild);
    }
  }

  function updateTally(){
    const know = Object.values(progress).filter(v => v === "know").length;
    const again = Object.values(progress).filter(v => v === "again").length;
    els.knowCount.textContent = know;
    els.learnCount.textContent = again;
  }

  function flipCard(){
    if(state.deck.length === 0) return;
    state.flipped = !state.flipped;
    els.card.classList.toggle("flipped", state.flipped);
  }

  function nextCard(rating){
    const c = currentCard();
    if(c){
      progress[c.id] = rating;
      saveProgress();
    }
    if(state.index < state.deck.length - 1){
      state.index++;
    } else {
      state.index = 0;
    }
    render();
  }

  // ---------- events ----------
  els.card.addEventListener("click", flipCard);
  els.card.addEventListener("keydown", (e) => {
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flipCard(); }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "ArrowRight"){ nextCard(progress[currentCard()?.id] || "again"); }
    if(e.key === "1"){ nextCard("again"); }
    if(e.key === "2"){ nextCard("know"); }
  });

  els.againBtn.addEventListener("click", () => nextCard("again"));
  els.knowBtn.addEventListener("click", () => nextCard("know"));

  els.shuffleBtn.addEventListener("click", shuffleDeck);

  els.dirBtn.addEventListener("click", () => {
    state.direction = state.direction === "de-en" ? "en-de" : "de-en";
    els.dirBtn.textContent = state.direction === "de-en" ? "DE → EN" : "EN → DE";
    render();
  });

  els.resetBtn.addEventListener("click", () => {
    if(confirm("Fortschritt für alle Karten zurücksetzen?")){
      progress = {};
      saveProgress();
      render();
    }
  });

  function setMode(mode){
    state.mode = mode;
    els.modeTranslate.classList.toggle("active", mode === "translate");
    els.modeArticle.classList.toggle("active", mode === "article");
    els.dirBtn.style.display = mode === "article" ? "none" : "";
    buildCategoryOptions();
    buildDeck();
    render();
  }

  els.modeTranslate.addEventListener("click", () => setMode("translate"));
  els.modeArticle.addEventListener("click", () => setMode("article"));

  function setChapter(ch){
    state.chapterFilter = ch;
    els.tabsContainer.querySelectorAll(".chapter-tab").forEach(b => {
      b.classList.toggle("active", b.dataset.ch === String(ch));
    });
    buildCategoryOptions();
    buildDeck();
    render();
  }

  function renderChapterTabs(){
    let html = `<button class="chapter-tab active" data-ch="all">ALLE</button>`;
    VOCAB_DATA.chapters.forEach(ch => {
      const dark = shade(ch.accent, -0.32);
      html += `<button class="chapter-tab" data-ch="${ch.number}" style="background:linear-gradient(160deg, ${ch.accent}, ${dark})">${ch.number}</button>`;
    });
    els.tabsContainer.innerHTML = html;
    els.tabsContainer.querySelectorAll(".chapter-tab").forEach(btn => {
      btn.addEventListener("click", () => setChapter(btn.dataset.ch));
    });
  }

  els.categorySelect.addEventListener("change", (e) => {
    state.categoryFilter = e.target.value;
    buildDeck();
    render();
  });

  // ---------- init ----------
  renderChapterTabs();
  buildCategoryOptions();
  buildDeck();
  render();
})();
</script>
</body>
</html>
